[package]
name = "juno-driver-lutron-caseta-leap"
version = "1.0.0"
edition = "2024"
description = "Lutron Caséta Smart Bridge and its dimmers over LEAP"
publish = false

[lib]
name = "juno_driver_lutron_caseta_leap"
crate-type = ["cdylib", "rlib"]

[dependencies]
# The SDK re-exports core's types, so the two are one unit: a driver built against a
# different core than it runs on is refused by the ABI check rather than half-understood.
# Pinning the tag is what makes that check redundant in practice.
juno-driver-sdk = { git = "https://github.com/junohouse/core.git", tag = "v0.1.0" }
serde_json = "1"

# Pairing needs a keypair and a CSR to hand the bridge — nothing in std or the already-installed
# deps generates X.509, and rolling ASN.1 DER by hand for this is not a reasonable substitute.
rcgen = "0.13"

# `examples/leap_probe.rs` talks to a real bridge to check these fixtures against what the
# hardware actually says. It drives the controller's own TLS and LEAP transport rather than a
# reimplementation, which is the entire point of it — so it needs core directly, and only
# when building examples.
[dev-dependencies]
junod = { git = "https://github.com/junohouse/core.git", tag = "v0.1.0" }

# Working on core and this driver at once: point the SDK at a local checkout.
#   [patch."https://github.com/junohouse/core.git"]
#   juno-driver-sdk = { path = "../../../core/sdk" }
#   junod = { path = "../../../core" }
